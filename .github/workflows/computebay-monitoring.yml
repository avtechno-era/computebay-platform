name: ComputeBay Monitoring Build

# Builds the ComputeBay monitoring sidecar image and publishes it to GHCR.
# The appliance pulls this in packages/server/src/setup/monitoring-setup.ts
# (getMonitoringImageName). Replaces upstream's dokploy/monitoring Docker Hub
# pipeline (.github/workflows/monitoring.yml).

on:
  push:
    branches: [main, canary]
  workflow_dispatch:

env:
  # ghcr.io/avtechno-era/computebay-monitoring — keep in sync with
  # COMPUTEBAY_MONITORING_IMAGE_REPO in packages/server/src/services/settings.ts
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/computebay-monitoring

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        id: meta
        run: |
          IMAGE_NAME_LC=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${IMAGE_NAME_LC}:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${IMAGE_NAME_LC}:canary" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.monitoring
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
